# yaml-language-server: $schema=https://raw.githubusercontent.com/jimhoyd-com/urlcode/1b2b44b3a94ce79a5b630729f944fabe75850da1/schemas/urlcode.schema.json
# File locations do not change route paths. GET/HEAD are the default methods.
version: "1"
routes:
  # Your code runs when this URL is requested.
  /hello/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: {type: string, minLength: 1, maxLength: 80}
    middleware:
      - source: middleware/headers.mjs
    function:
      source: functions/hello.mjs
      args:
        name: {from: path, name: name}
    response:
      headers:
        X-Powered-By: URLCode
