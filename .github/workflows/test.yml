name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run validate
      - run: npm test
  readiness:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Allow only the initial empty-project audit result
        run: |
          set +e
          output="$(npm run audit -- --compliance baseline)"
          status=$?
          set -e
          printf '%s\n' "$output"
          report="$(printf '%s\n' "$output" | tail -n 1)"
          node -e '
            const [status, report] = process.argv.slice(1);
            const parsed = JSON.parse(report);
            process.exit(status === "1" && parsed.ready === false &&
              Array.isArray(parsed.notReadyReasons) &&
              parsed.notReadyReasons.length === 1 &&
              parsed.notReadyReasons[0] === "no-active-routes" ? 0 : 1);
          ' "$status" "$report"
  verify-complete:
    name: verify-complete
    needs: [test, readiness]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test.result }}" = success && test "${{ needs.readiness.result }}" = success
